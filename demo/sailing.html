<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpinakerCharts | Sailing</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f1c;color:#e9f4ff;font:14px Inter,system-ui,sans-serif}header{max-width:1300px;margin:auto;padding:40px 24px 25px}h1{font-size:clamp(35px,5vw,66px);letter-spacing:-2px;margin:10px 0}h1 span{color:#59ded0}.eyebrow{color:#59ded0;letter-spacing:3px;font-size:10px;font-weight:700}p{color:#8ea4bd;line-height:1.65}main{max-width:1300px;margin:auto;display:grid;grid-template-columns:1.05fr .95fr;gap:18px;padding:0 24px 50px}article{background:#101a2b;border:1px solid #25374f;border-radius:16px;padding:18px;min-width:0}h2{font-size:16px;margin:2px 0 10px}.sub{color:#8ea4bd;font-size:12px;margin:0 0 20px}button{background:#1e3448;color:#e8f6ff;padding:9px 15px;border:1px solid #35546e;border-radius:7px;cursor:pointer}button:hover{border-color:#59ded0}#timeline,#heatmap{min-height:250px}.wide{grid-column:1/-1}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.kpis div{padding:18px;background:#17263a;border-radius:11px}.kpis small{font-size:10px;color:#95abc2}.kpis strong{display:block;font-size:29px;letter-spacing:-1px;margin-top:6px}@media(max-width:850px){main{grid-template-columns:1fr}.wide{grid-column:auto}.kpis{grid-template-columns:1fr 1fr 1fr}}@media(max-width:440px){.kpis{grid-template-columns:1fr}}
</style></head><body><main><article><h2>True wind speed polar</h2><div id="polar"></div></article><article><h2>Telemetry overview</h2><div class="kpis"><div><small>AVG SOG</small><strong>7.46 kn</strong></div><div><small>AVG TWS</small><strong>12.3 kn</strong></div><div><small>EFFICIENCY</small><strong>91%</strong></div></div><div id="timeline"></div></article><article class="wide"><h2>Speed by true wind</h2><div id="heatmap"></div></article></main><script type="module">
import{createChart}from '../src/index.js';import{createSailingPolar,buildPerformanceMatrix}from '../src/sailing.js';
const wind=[6,9,12,15,18],angles=[0,30,40,50,60,70,80,90,100,110,120,130,140,150,160,170,180];
const samples=wind.flatMap(tws=>angles.map(twa=>({tws,twa,speed:Math.max(0.4,(2.0+Math.sin(twa*Math.PI/180)*4.0+Math.sin(twa*Math.PI/90)*1.3)*(0.55+tws/24))})));
const polar=createSailingPolar('#polar',{data:samples,height:400});
const timeline=Array.from({length:120},(_,i)=>({time:`${String(Math.floor(i/60)+10).padStart(2,'0')}:${String(i%60).padStart(2,'0')}`,sog:7.4+1.1*Math.sin(i*.12)+.34*Math.sin(i*.7),vmg:4.7+.85*Math.sin(i*.13+.25)}));
const chart=createChart('#timeline',{type:'area',data:timeline,x:'time',series:[{key:'sog',name:'SOG'},{key:'vmg',name:'VMG'}],height:285,zoom:true,wheelZoom:true,crosshair:true});
const grid=buildPerformanceMatrix(samples);const heat=createChart('#heatmap',{type:'heatmap',data:grid.map(p=>({wind:`${p.tws} kn`,angle:`${p.twa}°`,speed:p.value})),x:'wind',y:'angle',value:'speed',height:420});

</script></body></html>
